version: 0.2

env:
  shell: bash
  variables:
    TF_ROOT: environments/dev/infra

phases:
  install:
    commands:
      - set -euo pipefail
      - TOFU_VERSION="1.11.0"
      - curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh
      - chmod +x install-opentofu.sh
      - ./install-opentofu.sh --install-method standalone
      - tofu version

  pre_build:
    commands:
      - set -euo pipefail
      - cd "$CODEBUILD_SRC_DIR/$TF_ROOT"
      - pwd
      - ls -la
      - echo "Packaging flush_elasticache Lambda"
      - rm -rf lambda/flush_elasticache/package
      - mkdir -p lambda/flush_elasticache/package
      - python3 -m pip install -r lambda/flush_elasticache/requirements.txt -t lambda/flush_elasticache/package
      - cp lambda/flush_elasticache/main.py lambda/flush_elasticache/package/
      - echo "Preparing NAT Gateway hibernate override"
      - |
        cat > hibernate.auto.tfvars.json <<EOF
        {
          "natgw_azs": ${NATGW_AZS_JSON}
        }
        EOF
      - cat hibernate.auto.tfvars.json

  build:
    commands:
      - set -euo pipefail
      - cd "$CODEBUILD_SRC_DIR/$TF_ROOT"
      - pwd
      - ls -la
      - tofu init -input=false
      - tofu plan -input=false -out=tfplan
      - tofu apply -input=false -auto-approve tfplan
