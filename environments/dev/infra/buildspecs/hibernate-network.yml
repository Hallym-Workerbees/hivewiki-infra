version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - set -euo pipefail
      - echo "Installing OpenTofu"
      - TOFU_VERSION="1.11.0"
      - curl -fsSL "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip" -o tofu.zip
      - unzip -o tofu.zip -d /usr/local/bin
      - tofu version

  pre_build:
    commands:
      - set -euo pipefail
      - echo "Preparing NAT Gateway hibernate override"
      - |
        cat > hibernate.auto.tfvars.json <<EOF
        {
          "natgw_azs": []
        }
        EOF
      - cat hibernate.auto.tfvars.json

  build:
    commands:
      - set -euo pipefail
      - tofu init -input=false
      - tofu plan -input=false -out=tfplan
      - tofu apply -input=false -auto-approve tfplan
