ci:
  skip:
    - terraform_fmt
    - terraform_validate

exclude: |
  (?x)^(
    .*/\.terraform/.*|
    .*/\.terragrunt-cache/.*|
    \.terraform/.*|
    \.terragrunt-cache/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.106.0
    hooks:
      - id: terraform_fmt
        files: |
          (?x)^(
            modules/.*|
            live/cluster/tenants/dev/storage/.*
          )$
        args:
          - --hook-config=--tf-path=tofu
        exclude: |
          (?x)^(
            .*/\.terraform/.*|
            .*/\.terragrunt-cache/.*|
            \.terraform/.*|
            \.terragrunt-cache/.*
          )$
      - id: terraform_validate
        files: |
          (?x)^(
            modules/.*|
            live/cluster/tenants/dev/storage/.*
          )$
        args:
          - --hook-config=--tf-path=tofu
        exclude: |
          (?x)^(
            .*/\.terraform/.*|
            .*/\.terragrunt-cache/.*|
            \.terraform/.*|
            \.terragrunt-cache/.*
          )$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
