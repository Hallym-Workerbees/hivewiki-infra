version: 0.2

env:
  shell: bash
  variables:
    TF_ROOT: live/cluster/vpc

phases:
  install:
    commands:
      - set -euo pipefail
      - TOFU_VERSION="1.11.0"
      - TERRAGRUNT_VERSION="0.84.1"
      - curl --proto '=https' --tlsv1.2 -fsSL https://get.opentofu.org/install-opentofu.sh -o install-opentofu.sh
      - chmod +x install-opentofu.sh
      - ./install-opentofu.sh --install-method standalone
      - curl -fsSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" -o terragrunt
      - install -m 0755 terragrunt /usr/local/bin/terragrunt
      - tofu version
      - terragrunt --version

  pre_build:
    commands:
      - set -euo pipefail
      - cd "$CODEBUILD_SRC_DIR/$TF_ROOT"
      - echo "Preparing NAT Gateway hibernate override"
      - |
        cat > hibernate.auto.tfvars.json <<EOF
        {
          "natgw_azs": ${NATGW_AZS_JSON},
          "enable_full_vpce": ${ENABLE_VPCE_JSON}
        }
        EOF
      - cat hibernate.auto.tfvars.json

  build:
    commands:
      - set -euo pipefail
      - cd "$CODEBUILD_SRC_DIR/$TF_ROOT"
      - terragrunt init --non-interactive -input=false
      - terragrunt plan --non-interactive -input=false -out=tfplan
      - terragrunt apply --non-interactive -input=false -auto-approve tfplan
