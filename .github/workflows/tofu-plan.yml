name: OpenTofu Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - ".terraform.lock.hcl"
      - "environments/dev/infra/lambda/**"
      - "environments/dev/infra/scripts/build_lambdas.sh"
      - ".github/workflows/tofu-plan.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - working_directory: environments/dev/infra
            env: dev

          - working_directory: environments/prod/infra
            env: prod

          - working_directory: environments/shared
            env: shared

    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      TF_VAR_dockerhub_access_token: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      TF_VAR_ghcr_username: ${{ secrets.GHCR_USERNAME }}
      TF_VAR_ghcr_access_token: ${{ secrets.GHCR_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # 5.0.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # 2.0.0

      - name: Set up Python
        if: matrix.env == 'dev'
        uses: actions/setup-python@42375524ee3024772b491695504333002d88d40a # 5.4.0
        with:
          python-version: "3.12"

      - name: Build Lambda package
        if: matrix.env == 'dev'
        run: scripts/build_lambdas.sh

      - name: OpenTofu init
        run: tofu init -input=false -reconfigure

      - name: OpenTofu plan (dev)
        if: matrix.env == 'dev'
        env:
          TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
        run: tofu plan -no-color -input=false

      - name: OpenTofu plan (prod)
        if: matrix.env == 'prod'
        env:
          TF_VAR_db_password: ${{ secrets.PROD_DB_PASSWORD }}
        run: tofu plan -no-color -input=false

      - name: OpenTofu plan (shared)
        if: matrix.env == 'shared'
        run: tofu plan -no-color -input=false
