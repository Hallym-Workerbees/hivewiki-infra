name: Terragrunt Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.tf"
      - "**/*.hcl"
      - "**/*.tfvars"
      - ".terraform.lock.hcl"
      - "live/**/lambda/**"
      - ".github/workflows/tofu-plan.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: shared
            working_directory: live/shared
          - stack: cluster-vpc
            working_directory: live/cluster/vpc
          - stack: cluster-observability
            working_directory: live/cluster/observability
          - stack: cluster-infra
            working_directory: live/cluster/infra
          - stack: cluster-edge
            working_directory: live/cluster/edge
          - stack: cluster-eks-addons
            working_directory: live/cluster/eks-addons
          - stack: tenant-dev-app
            working_directory: live/cluster/tenants/dev/app
          - stack: tenant-dev-cache
            working_directory: live/cluster/tenants/dev/cache
          - stack: tenant-dev-rds
            working_directory: live/cluster/tenants/dev/rds
          - stack: tenant-dev-ops
            working_directory: live/cluster/tenants/dev/ops
          - stack: tenant-prod-app
            working_directory: live/cluster/tenants/prod/app
          - stack: tenant-prod-cache
            working_directory: live/cluster/tenants/prod/cache
          - stack: tenant-prod-rds
            working_directory: live/cluster/tenants/prod/rds
          - stack: cluster-logging
            working_directory: live/cluster/logging

    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      TG_NON_INTERACTIVE: "true"
      TF_INPUT: "false"
      TF_VAR_dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      TF_VAR_dockerhub_access_token: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      TF_VAR_ghcr_username: ${{ secrets.GHCR_USERNAME }}
      TF_VAR_ghcr_access_token: ${{ secrets.GHCR_ACCESS_TOKEN }}
      TF_VAR_db_password: ${{ startsWith(matrix.stack, 'tenant-dev-') && secrets.DEV_DB_PASSWORD || startsWith(matrix.stack, 'tenant-prod-') && secrets.PROD_DB_PASSWORD || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # 5.0.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@fc711fa910b93cba0f3fbecaafc9f42fd0c411cb # 2.0.0

      - name: Set up Terragrunt
        run: |
          TG_VERSION="$(curl -fsSL https://api.github.com/repos/gruntwork-io/terragrunt/releases/latest | jq -r '.tag_name')"
          curl -fsSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt plan
        run: terragrunt plan -no-color
